name: Pages

on:
  pull_request:
    paths:
      - ".github/assets/**"
      - ".github/workflows/pages.yml"
      - "pyproject.toml"
      - "scripts/build_site.py"
      - "scripts/build_social_card.py"
      - "site/**"
      - "tests/test_site_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/assets/**"
      - ".github/workflows/pages.yml"
      - "pyproject.toml"
      - "scripts/build_site.py"
      - "scripts/build_social_card.py"
      - "site/**"
      - "tests/test_site_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests/test_site_contract.py -q
      - name: Verify generated social card is current
        run: |
          python scripts/build_social_card.py "${RUNNER_TEMP}/social-card.png"
          cmp "${RUNNER_TEMP}/social-card.png" .github/assets/social-card.png

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v5
      - name: Build deterministic bilingual site
        run: |
          python scripts/build_site.py \
            --output "${RUNNER_TEMP}/xout-pages" \
            --site-url "${{ steps.pages.outputs.base_url }}/" \
            --repository-url "${{ github.server_url }}/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v3
        with:
          path: ${{ runner.temp }}/xout-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v4
