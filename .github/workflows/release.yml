name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install ".[test]"
      - run: npm install --global @anthropic-ai/claude-code@2.1.235
      - name: Validate release version contract
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"
      - run: claude plugin validate .
      - name: Run unit and integration tests
        run: python -m pytest tests/ -q
      - name: Build and validate the installable plugin archive
        run: |
          python scripts/build_plugin_archive.py /tmp/xout-plugin.zip
          mkdir /tmp/xout-plugin
          python -m zipfile -e /tmp/xout-plugin.zip /tmp/xout-plugin
          claude plugin validate /tmp/xout-plugin

  release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
      SOURCE_DATE_EPOCH: '1767225600' # 2026-01-01 UTC; reproducible archives
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[release]"
      - name: Validate tag, package, and plugin versions
        run: |
          VERSION="$(python scripts/check_release_version.py --tag "${GITHUB_REF_NAME}" --print-version)"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - run: python -m build
      - run: python scripts/normalize_sdist.py dist/*.tar.gz
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python scripts/build_plugin_archive.py "dist/xout-plugin-${VERSION}.zip"
      - name: Verify the isolated release wheel lifecycle
        run: |
          python -m venv /tmp/xout-wheel
          /tmp/xout-wheel/bin/python -m pip install --no-index dist/*.whl
          (
            cd /tmp
            /tmp/xout-wheel/bin/python -I -c "from importlib.metadata import version; import xout; print(version('xout'))"
            /tmp/xout-wheel/bin/xout doctor --base-dir /tmp/xout-wheel-data --json > /tmp/xout-doctor.json
          )
          python -c "import json; assert json.load(open('/tmp/xout-doctor.json'))['healthy'] is True"
      - run: cp scripts/verify_checksums.py dist/verify_checksums.py
      - name: Create and verify checksums
        run: |
          python scripts/build_checksums.py \
            --output dist/SHA256SUMS \
            dist/*.whl dist/*.tar.gz dist/*.zip dist/verify_checksums.py
          python scripts/verify_checksums.py dist/SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/verify_checksums.py
            dist/SHA256SUMS
          generate_release_notes: true
