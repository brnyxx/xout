[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xout"
version = "1.0.1"
description = "X out the AI behavior you never want again - cross out wrong agent behavior, keep the rule, plug it into Claude Code, Codex, OpenCode, Gemini CLI, Copilot, pi, Kiro or any AGENTS.md reader"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Brian Kim", email = "kim62210@gmail.com" }]
dependencies = []
keywords = ["claude-code", "codex", "opencode", "gemini-cli", "copilot", "kiro", "agents-md", "plugin", "preferences", "falsification", "local-first", "agent-skills"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "PyYAML>=6,<7"]
release = ["build>=1.2,<2", "twine>=5,<7"]

[project.scripts]
xout = "xout.cli:main"
popper = "xout.cli:main"

[tool.setuptools.packages.find]
include = ["xout*"]

[tool.setuptools.package-data]
"xout" = [
    "_data/fixtures/*.json",
    "_data/fixtures/en/*.json",
    "_data/fixtures/ja/*.json",
    "_data/fixtures/zh/*.json",
    "_data/ground_truth/*.sha256",
    "_data/ground_truth/*.txt",
    "_data/prereg/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
